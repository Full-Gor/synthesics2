<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Synthesics2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .auth-header {
            background: var(--primary);
            padding: 30px;
            text-align: center;
            color: #ffffff;
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .auth-header .version {
            color: inherit;
        }

        .auth-header p {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-form {
            padding: 30px;
        }

        .auth-form .form-group {
            margin-bottom: 20px;
        }

        .auth-form .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .auth-form .form-group input {
            width: 100%;
            padding: 14px 18px;
            font-family: var(--font-main);
            font-size: 14px;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .auth-form .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
        }

        .auth-form .form-group input::placeholder {
            color: var(--text-muted);
        }

        .auth-form .form-group small {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .auth-form .btn {
            width: 100%;
            padding: 14px;
            font-size: 12px;
        }

        .auth-footer {
            text-align: center;
            padding: 20px 30px 30px;
            border-top: 1px solid var(--divider);
        }

        .auth-footer p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid var(--accent-success);
            color: var(--accent-success);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Synthesics<span class="version">2</span></h1>
            <p>Creer un compte</p>
        </div>

        <form class="auth-form" id="registerForm">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="form-group">
                <label for="username">Pseudo</label>
                <input type="text" id="username" name="username" required
                       placeholder="Votre pseudo" autocomplete="username" minlength="3">
                <small>Minimum 3 caracteres</small>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       placeholder="Votre mot de passe" autocomplete="new-password" minlength="6">
                <small>Minimum 6 caracteres</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       placeholder="Confirmer votre mot de passe" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                S'inscrire
            </button>
        </form>

        <div class="auth-footer">
            <p>Deja un compte ? <a href="/login.html">Se connecter</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Vérifier si déjà connecté
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    window.location.href = '/';
                }
            } catch (err) {
                // Non connecté, rester sur la page
            }
        }

        checkAuth();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Les mots de passe ne correspondent pas';
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Inscription...';
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Erreur d\'inscription');
                }

                // Succès
                successMessage.textContent = 'Compte cree avec succes ! Redirection...';
                successMessage.classList.add('show');
                form.reset();

                // Rediriger vers login après 2 secondes
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);

            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'S\'inscrire';
            }
        });
    </script>
</body>
</html>
